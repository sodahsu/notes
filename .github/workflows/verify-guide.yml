name: Verify Orca Guide & Specs

on:
  pull_request:
    paths:
      - 'SPEC.md'
      - 'AGENTS.md'
      - 'README.md'
      - 'index.html'
      - 'orca-openspec-designer-guide-with-ui.html'
      - 'tests/**'
      - '.github/workflows/verify-guide.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Run guide and specification tests
        run: node --test tests/*.test.mjs
