name: Verify Orca Guide & Specs

on:
  push:
    branches:
      - '**'
  pull_request:
    paths:
      - 'SPEC.md'
      - 'AGENTS.md'
      - 'README.md'
      - 'index.html'
      - 'orca-openspec-designer-guide-with-ui.html'
      - 'guide.html'
      - 'tests/**'
      - '.github/workflows/verify-guide.yml'
    branches-ignore:
      - 'dependabot/**'

concurrency:
  group: verify-guide-${{ github.event.pull_request.number || github.ref }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
      classification_ok: ${{ steps.classify.outputs.classification_ok }}
    steps:
      - name: Classify changed files (fail closed)
        id: classify
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -eu
          echo 'docs_only=false' >> "$GITHUB_OUTPUT"
          echo 'classification_ok=false' >> "$GITHUB_OUTPUT"
          files=$(gh api "repos/$GH_REPOSITORY/pulls/$PR_NUMBER/files" --paginate --jq '.[].filename') || exit 0
          [ -n "$files" ] || exit 0
          docs_only=true
          while IFS= read -r file; do
            case "$file" in
              *.md|docs/*|openspec/*|LICENSE) ;;
              *) docs_only=false ;;
            esac
          done <<EOF
          $files
          EOF
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"
          echo 'classification_ok=true' >> "$GITHUB_OUTPUT"

  verify:
    needs: [changes]
    if: ${{ !cancelled() && (needs.changes.outputs.classification_ok != 'true' || needs.changes.outputs.docs_only != 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Run guide and specification tests
        run: node --test tests/*.test.mjs

  browser:
    needs: [changes]
    if: ${{ !cancelled() && (needs.changes.outputs.classification_ok != 'true' || needs.changes.outputs.docs_only != 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Cache npm packages
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-playwright-1.56.1
          restore-keys: ${{ runner.os }}-npm-playwright-
      - name: Install Playwright (CI only)
        run: npm install --no-save --no-audit --no-fund playwright@1.56.1
      - name: Install Chromium
        run: npx playwright install chromium
      - name: Check real browser interaction
        run: node --test tests/browser-smoke.mjs
